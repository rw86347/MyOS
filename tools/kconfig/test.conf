# tools/kconfig/test.conf — the kernel config `make test` puts on its test
# disks (a myos-config partition, generation 3): different from the built-in
# default (config/slots.conf), so the log shows which one the kernel used.
# Power features both test families have (Pentium M and Zen).
mode = soft-realtime
latency_budget_us = 100

[slots]
2  = audio
4  = brakes
9  = brakes
12 = audio
14 = brakes
19 = brakes

[task audio]
program = /usr/bin/myos-audiod
uid = 65534
gid = 18

[task brakes]
program = /bin/brakes
args = --hz 200
uid = 65534
gid = 65534

[power]
on = cpu_speed deep_idle tickless
