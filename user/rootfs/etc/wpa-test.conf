# wpa_supplicant's settings for the simulated WPA2 network of `make test`
# kernels (drivers/net/wireless/sim.c: SIM_PASSPHRASE). The control socket
# is how wpa_cli (and the tray icon, live/myos-wifi) talk to it.
ctrl_interface=/var/run/wpa_supplicant
network={
    ssid="MyOS-Test"
    psk="myos-wifi-test"
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    group=CCMP
}
