# slots.conf — which named task runs in which time slot.
#
# Time is a repeating "major frame" of 20 slots x 1 ms = 20 ms.
# Slots 1 and 10 always belong to the system (the kernel's "main" thread)
# and can't be assigned here. Every other slot may have at most one owner.
# A slot nobody owns runs the idle thread.
#
# Format:   name   slot slot slot ...      (name: up to 15 characters)
#
# The build turns this file into a C table (tools/slots2c.awk); edit it and
# run `make` again.

brakes   4 9 14 19      # every 5 ms, 1 ms each: guaranteed timing
radio    6 16           # every 10 ms
