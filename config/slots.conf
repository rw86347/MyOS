# slots.conf — which named task runs in which time slot.
#
# Time is a repeating "major frame" of 20 slots x 1 ms = 20 ms, numbered
# 0-19. Slots 0 and 10 always belong to the system (the kernel's "main"
# thread) and can't be assigned here. Every other slot may have at most one
# owner. A slot nobody owns runs leftover work, or the idle thread.
#
# Format:   name   slot slot slot ...      (name: a small letter, then
#                                           a-z 0-9 - _, up to 15)
#
# This is the kernel's BUILT-IN config: the build turns it into the same
# bytes a myos-config partition holds (tools/kconfig/kconfig.py cdefault),
# and the kernel uses it until it finds one Settings › Kernel saved
# (docs/KERNEL-CONFIG.md). Edit it and run `make` again.

brakes   4 9 14 19      # every 5 ms, 1 ms each: guaranteed timing
radio    6 16           # every 10 ms
