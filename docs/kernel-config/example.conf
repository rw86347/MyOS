# docs/kernel-config/example.conf — the kernel config in text form (docs/KERNEL-CONFIG.md).
# python3 tools/kconfig/kconfig.py check docs/kernel-config/example.conf
mode = soft-realtime
arch = x86_64
latency_budget_us = 100

[slots]
2  = audio
4  = brakes
6  = radio
9  = brakes
12 = audio
14 = brakes
16 = radio
19 = brakes

[task audio]
program = /usr/bin/myos-audiod
args = --period 10ms
uid = 65534
gid = 18                    # audio

[task brakes]
program = /bin/brakes
args = --hz 200
uid = 65534
gid = 65534

[task radio]
program = /usr/local/bin/radio
uid = 1000
gid = 1000
restart_ms = 5000

[power]
on   = cpu_speed deep_idle tickless nvme_apst usb_autosuspend wifi_ps
seen = cpu_speed no_boost deep_idle c1e tickless nvme_apst pcie_aspm usb_autosuspend wifi_ps audio_pm
cpu_min_pct = 30
cpu_max_pct = 100
cstate_max = 3
